name: Auto Label Closed Issue

on:
  push:
    branches:
      - main  # または master (お使いのブランチ名に合わせてください)

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Closed Issue based on Commit Message
        uses: actions/github-script@v7
        with:
          script: |
            const commitMessage = context.payload.head_commit.message;
            console.log(`Commit message: ${commitMessage}`);

            // コミットメッセージから "c-1" などの連番パターンを抽出
            const match = commitMessage.match(/^(c-\d+)/);
            if (!match) {
              console.log("連番パターン（c-数字）が見つからないためスキップします。");
              return;
            }
            const labelName = match[1]; // 例: "c-1"
            console.log(`抽出されたラベル: ${labelName}`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. クローズされたIssueを新しい順に取得する
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "closed",
              sort: "updated",
              direction: "desc",
              per_page: 50
            });

            if (issues.data.length === 0) {
              console.log("クローズされたIssueが存在しないため終了します。");
              return;
            }

            // 2. フィルタリング：
            //   - "Not Planned" としてクローズされたものは除外する
            //   - すでに何らかの "c-数字" ラベルがついていれば除外する
            const targetIssues = issues.data.filter(issue => {
              // Not Planned (対応しない) としてクローズされたものはスルーする
              if (issue.state_reason === "not_planned") {
                return false;
              }

              // 既に何らかの "c-数字" という形式のラベルがついているかチェック
              const hasAnyCLabel = issue.labels.some(label => /^c-\d+$/.test(label.name));
              
              // "c-数字" がひとつもついていないものだけを対象にする
              return !hasAnyCLabel;
            });

            if (targetIssues.length === 0) {
              console.log(`条件に合致する（c-系ラベル未付与かつNot Plannedでない）クローズ済みIssueは見つかりませんでした。`);
              return;
            }

            console.log(`対象のクローズ済み Issue ${targetIssues.length}件 にラベルを付与します。`);

            // 3. ラベルが存在しなければ作成する（カラーは #c5def5 に固定）
            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              console.log(`ラベル "${labelName}" が存在しないため作成します。`);
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: "c5def5",
                description: "Auto generated commit label"
              });
            }

            // 4. 対象のクローズ済みIssueすべてにラベルを付与する
            for (const targetIssue of targetIssues) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: targetIssue.number,
                labels: [labelName]
              });
              console.log(`✨ クローズ済み Issue #${targetIssue.number} にラベル ${labelName} を付与しました！`);
            }